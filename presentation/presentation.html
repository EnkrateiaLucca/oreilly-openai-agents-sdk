# The Agent Loop

### How Agents Think and Act

---

# The Agent Loop Explained

The agent loop is the core execution cycle that powers every agent:

<div style="text-align: center; margin: 16px 0;">
  <div style="display: inline-flex; gap: 0; align-items: center;">
    <div style="background: #E86B5A; color: white; padding: 12px 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 14px;">RECEIVE INPUT</div>
    <div style="font-size: 24px; padding: 0 8px;">&rarr;</div>
    <div style="background: #F5C542; color: #000; padding: 12px 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 14px;">LLM DECIDES</div>
    <div style="font-size: 24px; padding: 0 8px;">&rarr;</div>
    <div style="background: #7CB56B; color: white; padding: 12px 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 14px;">TOOL CALLS</div>
    <div style="font-size: 24px; padding: 0 8px;">&rarr;</div>
    <div style="background: #5B9BD5; color: white; padding: 12px 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 14px;">FINAL OUTPUT</div>
  </div>
</div>

The loop continues until the LLM produces a **final output** (no more tool calls) or a **handoff** to another agent.

<div class="callout tip">
  <strong>Key Insight:</strong> The agent loop is what separates agents from simple LLM calls. It allows for multi-step reasoning and tool use.
</div>

.footnote[Notebook 00 &mdash; Agent Loop Fundamentals]

---

# Agent Loop in Code

```python
from agents import Agent, Runner

# The simplest agent loop
agent = Agent(
    name="Assistant",
    instructions="You are a helpful assistant",
    model="gpt-4o-mini"
)

# Runner.run_sync() manages the agent loop for you
result = Runner.run_sync(agent, "Write a haiku about recursion")
print(result.final_output)
```

**What happens under the hood:**
1. Input is sent to the LLM with agent instructions
2. LLM decides whether to use tools or produce output
3. If tools are called, results are fed back &rarr; loop continues
4. When LLM produces final text &rarr; loop ends

.footnote[Notebook 00 &mdash; Agent Loop Fundamentals]

# Building a Complete Tool Agent

```python
from agents import Agent, Runner, function_tool
from datetime import datetime

@function_tool
def get_current_time(timezone: str = "UTC") -> str:
    """Get current time in specified timezone"""
    return datetime.now().strftime("%Y-%m-%d %H:%M:%S")

@function_tool
def calculate_days(date1: str, date2: str) -> int:
    """Calculate days between two dates"""
    d1 = datetime.strptime(date1, "%Y-%m-%d")
    d2 = datetime.strptime(date2, "%Y-%m-%d")
    return abs((d2 - d1).days)

agent = Agent(
    name="TimeKeeper",
    instructions="Help with time and date queries",
    tools=[get_current_time, calculate_days]
)
```

# Structured Outputs with Pydantic

```python
from pydantic import BaseModel
from agents import Agent, Runner

class UserInfo(BaseModel):
    name: str
    age: int
    interests: list[str]

agent = Agent(
    name="DataCollector",
    instructions="Extract user information from text",
    model="gpt-4o-mini",
    output_type=UserInfo  # Forces structured output
)

result = Runner.run_sync(agent, "John is 25 and likes coding and hiking")
print(result.final_output.name)       # "John"
print(result.final_output.interests)  # ["coding", "hiking"]
```

<div class="callout">
<strong>Why structured output?</strong> Guarantees the agent returns data in a predictable schema &mdash; essential for building reliable pipelines.
</div>

.footnote[Notebook 02 &mdash; Structured Output and Context]

**Context enables:**

.footnote[Notebook 02 &mdash; Structured Output and Context]

# Context in Practice

```python
from agents import RunContextWrapper, function_tool

class UserSession:
    def __init__(self, user_id: str):
        self.user_id = user_id
        self.history = []
        self.preferences = {}

@function_tool
async def get_user_history(
    ctx: RunContextWrapper[UserSession]
) -> str:
    session = ctx.context
    return f"User {session.user_id}: {len(session.history)} messages"

@function_tool
async def update_preferences(
    ctx: RunContextWrapper[UserSession],
    key: str, value: str
) -> str:
    ctx.context.preferences[key] = value
    return f"Updated: {key}={value}"
```

<div class="callout tip">
<strong>Tip:</strong> Context objects are typed via generics &mdash; <code>RunContextWrapper[T]</code> ensures your tools receive the correct session type.
</div>

# Handoffs in Code

```python
from agents import Agent

# Specialized agents
spanish_agent = Agent(
    name="SpanishExpert",
    instructions="You only speak Spanish. Help Spanish speakers."
)

technical_agent = Agent(
    name="TechnicalExpert",
    instructions="You handle technical support queries."
)

# Router agent delegates to specialists
router_agent = Agent(
    name="Router",
    instructions="Route queries to the appropriate specialist",
    handoffs=[spanish_agent, technical_agent]
)
```

# Agents as Tools (Sub-Agent Pattern)

Instead of handoffs, you can use agents **as tools** for more controlled orchestration:

```python
from agents import Agent, Runner, function_tool

researcher = Agent(
    name="Researcher",
    instructions="Research topics using web search",
    tools=[WebSearchTool()]
)

@function_tool
async def research(query: str) -> str:
    """Delegate research to a specialized agent"""
    result = await Runner.run(researcher, query)
    return result.final_output

coordinator = Agent(
    name="Coordinator",
    instructions="Use the research tool to gather info, then synthesize",
    tools=[research]
)
```

<div class="callout">
<strong>Handoffs vs Tools:</strong> Handoffs transfer full control; agent-as-tool keeps the coordinator in charge.
</div>

.footnote[Notebook 05 &mdash; Capstone (Sub-agent pattern)]

# Guardrails in Code

```python
from agents import Agent, input_guardrail, output_guardrail
from agents import GuardrailFunctionOutput, InputGuardrailTripwireTriggered

@input_guardrail
async def check_math_homework(ctx, agent, input_data):
    """Prevent the agent from solving homework directly"""
    result = await Runner.run(
        homework_detector_agent, input_data, context=ctx.context
    )
    return GuardrailFunctionOutput(
        output_info=result.final_output,
        tripwire_triggered=result.final_output.is_homework
    )

agent = Agent(
    name="MathTutor",
    instructions="Help students understand math concepts",
    input_guardrails=[check_math_homework]
)
```

<div class="callout alert">
<strong>Tripwires</strong> raise <code>InputGuardrailTripwireTriggered</code> to stop execution when dangerous input is detected.
</div>

# Tracing in Code

```python
from agents import trace

async def process_customer_request(query: str):
    with trace("customer_workflow"):

        # Step 1: Analyze
        with trace("analyze"):
            analysis = await Runner.run(analyzer_agent, query)

        # Step 2: Route to specialist
        with trace("route"):
            response = await Runner.run(router_agent, analysis)

        # Step 3: Format response
        with trace("format"):
            final = await Runner.run(formatter_agent, response)

        return final
```

<div class="callout">
<strong>Traces are visible</strong> in the OpenAI dashboard under the Traces tab, giving you full observability.
</div>

# Sessions: Persistent Memory

Sessions automatically maintain conversation history across multiple runs:

```python
from agents import SQLiteSession

session = SQLiteSession(
    session_id="user_alice_123",
    db_path="conversations.db"
)

# First message
result = await Runner.run(assistant, "My name is Alice, I love hiking.", session=session)

# Second message — remembers the first!
result = await Runner.run(assistant, "What's my favorite hobby?", session=session)
# → "Your favorite hobby is hiking!"
```

<div class="card-row">
<div class="card" style="border-left: 4px solid #F5C542;">
  <strong>Same session</strong> = shared memory
</div>
<div class="card" style="border-left: 4px solid #5B9BD5;">
  <strong>Different session</strong> = isolated memory
</div>
</div>

<div class="callout tip">
<strong>Context vs Session:</strong> Context is local state for tools (not sent to LLM). Session is conversation history (sent to LLM).
</div>

# Human-in-the-Loop Pattern

For high-stakes actions, require human approval before execution:

```python
@function_tool
def request_refund_approval(order_id: str, amount: float, reason: str) -> str:
    """Request approval for a refund. Returns a request ID."""
    request_id = str(uuid.uuid4())[:8]
    PENDING_APPROVALS[request_id] = {
        "order_id": order_id, "amount": amount, "status": "pending"
    }
    return f"Refund request {request_id} created. Awaiting manager approval."

refund_agent = Agent(
    name="RefundAgent",
    instructions="""Process refund requests:
    1. First request approval using request_refund_approval
    2. Inform customer approval is pending
    3. Never process refunds without approval""",
    tools=[request_refund_approval, check_approval_status]
)
```

<div class="callout alert">
<strong>Key principle:</strong> Agents should request, not execute, irreversible actions.
</div>

# What is MCP?

<div class="cols">
<div class="col">

### Model Context Protocol

- **Open protocol** for connecting AI to data sources
- **Standardized interface** for tool integration
- **Secure context sharing** between apps

### Transport Types

| Type | Use Case |
|------|----------|
| `MCPServerStdio` | Local process |
| `MCPServerSse` | Remote SSE |
| `MCPServerStreamableHttp` | HTTP stream |

</div>
<div class="col">

### Available MCP Servers

- `mcp-server-filesystem` &mdash; File ops
- `mcp-server-git` &mdash; Git repository
- `mcp-server-github` &mdash; GitHub API
- `mcp-server-sqlite` &mdash; Database
- `mcp-server-google-maps` &mdash; Maps
- And many more...

</div>
</div>

> "MCP bridges the gap between AI agents and real-world systems"

.footnote[Source: [MCP Documentation](https://openai.github.io/openai-agents-python/mcp/)]

---

# MCP in Code

```python
from agents import Agent, Runner
from agents.mcp import MCPServerStdio

# Connect to a local MCP server
async with MCPServerStdio(
    command="npx",
    args=["-y", "@modelcontextprotocol/server-filesystem", "/Users/data"]
) as mcp_server:

    # MCP tools are auto-discovered
    agent = Agent(
        name="FileAgent",
        instructions="Help users manage files",
        mcp_servers=[mcp_server]
    )

    result = await Runner.run(agent, "List all Python files")
    print(result.final_output)
```

<div class="callout tip">
<strong>Auto-discovery:</strong> MCP servers expose their tools automatically &mdash; no need to define them manually.
</div>

.footnote[Notebook 04 &mdash; Guardrails, Sessions, Tracing, MCP]
